[project]
name = "benchpress-python"
version = "1.0.0"
description = "Official Python SDK and CLI for Benchpress Model Routing & Agent Trajectory Intelligence"
authors = [{ name = "Benchpress Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "rich>=13.0.0"
]

[project.scripts]
benchpress = "benchpress.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
